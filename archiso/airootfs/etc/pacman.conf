# NOVA OS — pacman de la session live
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
VerbosePkgLists
ParallelDownloads = 10
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Paquets Nova OS (embarqués sur la clé ; le système installé utilise le dépôt en ligne)
[nova]
SigLevel = Optional TrustAll
Server = file:///opt/nova/repo
