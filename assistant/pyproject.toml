[project]
name = "nova-ai"
version = "0.1.0"
description = "Nova IA — l'assistant hybride (local + cloud) intégré à Nova OS"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
cloud = ["anthropic>=2.0"]
test = ["pytest>=8"]

[project.scripts]
nova = "nova_ai.cli:main"
nova-assistant = "nova_ai.overlay:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
