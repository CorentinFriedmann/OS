<?xml version="1.0" encoding="UTF-8"?>
<!-- Nova OS — logo officiel : un anneau orbital et l'éclat d'une nova. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="nova-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.55" stop-color="#8a5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="nova-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#bff9ff"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="nova-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Anneau orbital, ouvert en haut à droite -->
  <path d="M 198.7 57.3 A 100 100 0 1 0 220.4 89.1"
        fill="none" stroke="url(#nova-gradient)" stroke-width="9"
        stroke-linecap="round" filter="url(#nova-glow)"/>
  <!-- Satellite sur l'orbite -->
  <circle cx="210.5" cy="72" r="9" fill="#ff2bd6" filter="url(#nova-glow)"/>
  <!-- Éclat de la nova (étoile à quatre branches) -->
  <path d="M128 46 Q137 119 210 128 Q137 137 128 210 Q119 137 46 128 Q119 119 128 46 Z"
        fill="url(#nova-gradient)" filter="url(#nova-glow)"/>
  <!-- Cœur lumineux -->
  <circle cx="128" cy="128" r="22" fill="url(#nova-core)"/>
</svg>
