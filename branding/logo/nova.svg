<?xml version="1.0" encoding="UTF-8"?>
<!-- Nova OS — logo officiel (style « verre ») : un anneau fin et l'éclat d'une nova. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="nova-glace" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c3d6ff"/>
      <stop offset="1" stop-color="#8ab4ff"/>
    </linearGradient>
    <linearGradient id="nova-anneau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8ab4ff" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <!-- Anneau fin, ouvert en haut à droite -->
  <path d="M 196.6 58.6 A 98 98 0 1 0 218.0 89.5"
        fill="none" stroke="url(#nova-anneau)" stroke-width="7" stroke-linecap="round"/>
  <!-- Satellite -->
  <circle cx="208.5" cy="73" r="7.5" fill="#b9adff"/>
  <!-- Éclat de la nova (étoile à quatre branches, plus fine) -->
  <path d="M128 54 Q135 121 202 128 Q135 135 128 202 Q121 135 54 128 Q121 121 128 54 Z"
        fill="url(#nova-glace)"/>
</svg>
