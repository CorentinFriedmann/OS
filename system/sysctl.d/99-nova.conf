# ╔══════════════════════════════════════════════════════════════╗
# ║  NOVA OS — réglages du noyau (inspirés de CachyOS)            ║
# ╚══════════════════════════════════════════════════════════════╝

# --- Mémoire : zram (swap compressé en RAM) plutôt que le disque ---------
# Avec zram, un « swappiness » élevé est bénéfique (recommandation Fedora/Pop!_OS)
vm.swappiness = 150
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.vfs_cache_pressure = 50
# Écritures disque regroupées : moins de micro-saccades
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
vm.dirty_writeback_centisecs = 1500
# Jeux récents (Proton/Steam) : beaucoup de zones mémoire
vm.max_map_count = 2147483642

# --- Réactivité -----------------------------------------------------------
kernel.nmi_watchdog = 0
# Évite le ralentissement volontaire des jeux qui font des « split locks »
kernel.split_lock_mitigate = 0
kernel.sched_autogroup_enabled = 1

# --- Réseau : BBR + file d'attente équitable, ouverture TCP rapide ----------
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.core.netdev_max_backlog = 4096

# --- Sécurité (sans coût de performance) ------------------------------------
kernel.kptr_restrict = 2
kernel.kexec_load_disabled = 1
kernel.printk = 3 3 3 3
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.file-max = 2097152
