# ╔══════════════════════════════════════════════════════════════╗
# ║  NOVA OS — invite de commande néon (starship)                 ║
# ╚══════════════════════════════════════════════════════════════╝
# Pour personnaliser : copie ce fichier dans ~/.config/starship.toml
"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
format = """
[╭─](#4a5378)${custom.nova}$username$hostname$directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration
[╰─](#4a5378)$character"""
right_format = "$time"

[custom.nova]
command = ""
when = true
format = "[󰙴 ](bold #00f0ff)"

[username]
show_always = false
style_user = "bold #ff2bd6"
format = "[$user]($style) "

[hostname]
ssh_only = true
style = "#8a5cff"
format = "[@ $hostname]($style) "

[directory]
style = "bold #00f0ff"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "#ff2bd6"
format = "[$symbol$branch]($style) "

[git_status]
style = "#ffd23f"
format = "([$all_status$ahead_behind]($style) )"

[python]
symbol = " "
style = "#ffd23f"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
style = "#3dffa8"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "#ff8a3d"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "#00f0ff"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2000
style = "#8a5cff"
format = "[󰚭 $duration]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "#4a5378"
format = "[$time]($style)"

[character]
success_symbol = "[❯](bold #00f0ff)"
error_symbol = "[❯](bold #ff3860)"
vimcmd_symbol = "[❮](bold #3dffa8)"
