# ╔══════════════════════════════════════════════════════════════╗
# ║  NOVA OS — terminal de secours foot                           ║
# ╚══════════════════════════════════════════════════════════════╝
# Utilisé par nova-terminal quand Ghostty ne peut pas utiliser la carte
# graphique (machine virtuelle, pilote trop ancien). Mêmes couleurs que Ghostty.
# Tes réglages personnels vont dans ~/.config/foot/foot.ini

font=JetBrainsMono Nerd Font:size=11
pad=14x12 center
term=xterm-256color

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.92
cursor=0b0d12 8ab4ff
background=0e1117
foreground=e2e7ef
selection-background=2a3346
selection-foreground=ffffff
regular0=1c212b
regular1=ff8f8f
regular2=7ee2b8
regular3=f2cf86
regular4=8ab4ff
regular5=b9adff
regular6=7fd3d0
regular7=c9d0dc
bright0=4b5263
bright1=ffa8a8
bright2=9eecc9
bright3=f6dba3
bright4=a9c7ff
bright5=cdc4ff
bright6=9fe0dd
bright7=f4f6fa
