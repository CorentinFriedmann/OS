# ╔══════════════════════════════════════════════════════════════╗
# ║  NOVA OS — lanceur d'applications (fuzzel)                    ║
# ╚══════════════════════════════════════════════════════════════╝
# Pour personnaliser : copie ce fichier dans ~/.config/fuzzel/fuzzel.ini

[main]
font=Inter:size=13,JetBrainsMono Nerd Font:size=13
use-bold=yes
dpi-aware=auto
prompt="  ❯  "
placeholder=Rechercher une application…
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic,keywords,categories
terminal=ghostty -e
match-mode=fzf
sort-result=yes
match-counter=yes
show-actions=yes
anchor=center
lines=9
width=42
tabs=4
horizontal-pad=24
vertical-pad=18
inner-pad=12
image-size-ratio=0.5
line-height=30
letter-spacing=0.2
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=0a0d1af0
text=c8d3f5ff
message=8b95b8ff
prompt=00f0ffff
placeholder=4a5378ff
input=e6f1ffff
match=ff2bd6ff
selection=00f0ff26
selection-text=ffffffff
selection-match=ff2bd6ff
counter=4a5378ff
border=00f0ffaa

[border]
width=2
radius=18
selection-radius=10
