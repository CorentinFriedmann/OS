# ╔══════════════════════════════════════════════════════════════╗
# ║  NOVA OS — lanceur d'applications (fuzzel)                    ║
# ╚══════════════════════════════════════════════════════════════╝
# Pour personnaliser : copie ce fichier dans ~/.config/fuzzel/fuzzel.ini

[main]
font=Inter:size=13,JetBrainsMono Nerd Font:size=13
use-bold=yes
dpi-aware=auto
prompt="     "
placeholder=Rechercher une application…
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic,keywords,categories
terminal=nova-terminal -e
match-mode=fzf
sort-result=yes
match-counter=yes
show-actions=yes
anchor=center
lines=9
width=42
tabs=4
horizontal-pad=24
vertical-pad=18
inner-pad=12
image-size-ratio=0.5
line-height=30
letter-spacing=0.2
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# Palette « Verre » : graphite translucide, accent bleu glacier
background=12151bea
text=d5dbe6ff
message=a4adbdff
prompt=8ab4ffff
placeholder=6c7486ff
input=eef1f6ff
match=8ab4ffff
selection=ffffff17
selection-text=ffffffff
selection-match=c3d6ffff
counter=6c7486ff
border=ffffff1c

[border]
width=1
radius=18
selection-radius=10
