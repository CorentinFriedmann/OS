# ╔══════════════════════════════════════════════════════════════╗
# ║  NOVA OS — écran de verrouillage (hyprlock)                   ║
# ╚══════════════════════════════════════════════════════════════╝
# Pour personnaliser : copie ce fichier dans ~/.config/hypr/hyprlock.conf

# Palette « Verre » (branding/palette.json)
$font = Inter
$text_font = Inter
$accent = rgba(8ab4ffff)
$lavender = rgba(b9adffff)
$fg = rgba(eef1f6ff)
$dim = rgba(a4adbdff)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = nova, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, nova
    animation = fadeOut, 1, 4, nova
    animation = inputFieldDots, 1, 2, nova
}

background {
    monitor =
    path = /usr/share/backgrounds/nova/nova-verre-lock.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.8
    vibrancy = 0.1
    noise = 0.015
}

# Logo Nova
image {
    monitor =
    path = /usr/share/pixmaps/nova-logo.png
    size = 72
    rounding = -1
    border_size = 0
    position = 0, 300
    halign = center
    valign = center
}

# Heure : grande et fine
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 108
    font_family = $font Light
    position = 0, 150
    halign = center
    valign = center
}

# Date en français
label {
    monitor =
    text = cmd[update:60000] LC_TIME=fr_FR.UTF-8 date +"%A %-d %B"
    color = $dim
    font_size = 20
    font_family = $font Medium
    position = 0, 50
    halign = center
    valign = center
}

# Salutation
label {
    monitor =
    text = Bon retour, $USER
    color = $dim
    font_size = 15
    font_family = $text_font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 58
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(ffffff26)
    inner_color = rgba(161a22b3)
    font_color = $fg
    font_family = $text_font
    fade_on_empty = false
    placeholder_text = <span foreground="##a4adbd">Mot de passe…</span>
    fail_text = <span foreground="##ff8f8f">$FAIL ($ATTEMPTS)</span>
    check_color = $accent
    fail_color = rgba(ff8f8fff)
    capslock_color = rgba(f2cf86ff)
    rounding = 16
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(00000066)
    position = 0, -100
    halign = center
    valign = center
}

# Batterie et disposition clavier (bas de l'écran)
label {
    monitor =
    text = cmd[update:30000] nova-status lockscreen
    color = $dim
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
