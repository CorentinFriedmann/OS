# ╔══════════════════════════════════════════════════════════════╗
# ║  NOVA OS — écran de verrouillage (hyprlock)                   ║
# ╚══════════════════════════════════════════════════════════════╝
# Pour personnaliser : copie ce fichier dans ~/.config/hypr/hyprlock.conf

$font = Orbitron
$text_font = Inter
$cyan = rgba(00f0ffff)
$magenta = rgba(ff2bd6ff)
$violet = rgba(8a5cffff)
$fg = rgba(e6f1ffff)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = nova, 0.05, 0.9, 0.1, 1.05
    animation = fadeIn, 1, 4, nova
    animation = fadeOut, 1, 4, nova
    animation = inputFieldDots, 1, 2, nova
}

background {
    monitor =
    path = /usr/share/backgrounds/nova/nova-city-lock.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.75
    vibrancy = 0.2
    noise = 0.012
}

# Logo Nova
image {
    monitor =
    path = /usr/share/pixmaps/nova-logo.png
    size = 96
    rounding = -1
    border_size = 0
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00f0ff99)
    position = 0, 300
    halign = center
    valign = center
}

# Heure, avec halo néon
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 110
    font_family = $font Black
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(00f0ffcc)
    shadow_boost = 1.4
    position = 0, 150
    halign = center
    valign = center
}

# Date en français
label {
    monitor =
    text = cmd[update:60000] LC_TIME=fr_FR.UTF-8 date +"%A %-d %B"
    color = rgba(ff2bd6ff)
    font_size = 22
    font_family = $font Medium
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(ff2bd688)
    position = 0, 50
    halign = center
    valign = center
}

# Salutation
label {
    monitor =
    text = Bon retour, $USER
    color = rgba(8b95b8ff)
    font_size = 15
    font_family = $text_font
    position = 0, -20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 58
    outline_thickness = 3
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    outer_color = $cyan $violet $magenta 45deg
    inner_color = rgba(0a0d1acc)
    font_color = $fg
    font_family = $text_font
    fade_on_empty = false
    placeholder_text = <span foreground="##8b95b8">Mot de passe…</span>
    fail_text = <span foreground="##ff3860">$FAIL ($ATTEMPTS)</span>
    check_color = rgba(3dffa8ff) $cyan 120deg
    fail_color = rgba(ff3860ff) $magenta 40deg
    capslock_color = rgba(ffd23fff)
    rounding = 16
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(00f0ff55)
    position = 0, -100
    halign = center
    valign = center
}

# Batterie et disposition clavier (bas de l'écran)
label {
    monitor =
    text = cmd[update:30000] nova-status lockscreen
    color = rgba(8b95b8ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
