# ╔══════════════════════════════════════════════════════════════╗
# ║  NOVA OS — mise en veille automatique (hypridle)              ║
# ╚══════════════════════════════════════════════════════════════╝
# Réglée pour un portable. Pour personnaliser : copie ce fichier dans
# ~/.config/hypr/hypridle.conf

general {
    lock_cmd = nova-lock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

# 2 min 30 : on baisse la luminosité de l'écran et du clavier
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}
listener {
    timeout = 150
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

# 5 min : verrouillage
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5 min 30 : écran éteint
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 10 min : mise en veille si on est sur batterie
listener {
    timeout = 600
    on-timeout = nova-idle-suspend battery
}

# 30 min : mise en veille dans tous les cas
listener {
    timeout = 1800
    on-timeout = nova-idle-suspend always
}
