# Nova OS : tests, construction des paquets et de l'ISO, test complet en machine
# virtuelle (installation à côté d'un faux Windows + premier démarrage), publication.
# Les journaux de chaque job sont déposés dans la release « ci-logs », même en cas d'échec.
name: Nova OS

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      test_vm:
        description: "Test complet en machine virtuelle (installation + premier démarrage)"
        type: boolean
        default: true

permissions:
  contents: write   # publication des releases (ISO, dépôt [nova], journaux)

concurrency:
  group: nova-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # bash -eo pipefail : une erreur avant « | tee » fait bien échouer l'étape

env:
  SHELLCHECK_VERSION: v0.11.0

jobs:
  tests:
    name: Tests rapides
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Outils de test
        id: outils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gdisk dosfstools ntfs-3g mtools btrfs-progs lua5.4 python3-venv
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ -C /tmp
          echo "SHELLCHECK=/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" >> "$GITHUB_ENV"
          mkdir -p out/logs

      - name: Vérifications statiques (shellcheck, Python, Lua, JSON)
        id: lint
        run: bash scripts/ci/lint.sh 2>&1 | tee out/logs/lint.log

      - name: Assistant Nova IA (pytest, vrai SDK Anthropic contre un serveur local)
        id: assistant
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q "anthropic>=2,<3" pytest
          cd assistant
          /tmp/venv/bin/python -m pytest -q 2>&1 | tee ../out/logs/assistant-tests.log

      - name: Voix de Nova (Piper parle, faster-whisper comprend)
        id: voix
        run: bash scripts/ci/voice-check.sh 2>&1 | tee out/logs/voix.log

      - name: Installateur sur disques virtuels (dual-boot à côté d'un faux Windows)
        id: installateur
        run: sudo bash installer/tests/test-partitioning.sh 2>&1 | tee out/logs/installateur-tests.log

      - name: Journaux (release « ci-logs »)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: bash scripts/ci/publish-logs.sh tests

  iso:
    name: ISO + test en machine virtuelle
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # version des paquets = date + nombre de commits

      - name: Version
        id: version
        run: |
          echo "NOVA_VERSION=$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          mkdir -p out/logs

      - name: Place disque
        id: place
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          docker system prune --all --force > /dev/null
          df -h /

      - name: Paquets Nova et ISO (conteneur Arch Linux)
        id: construction
        run: |
          docker run --rm --privileged -v "$PWD:/src" -w /src \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" -e NOVA_VERSION \
            archlinux:latest bash scripts/ci/build-in-arch.sh

      - name: Empreinte SHA-256
        id: empreinte
        run: |
          cd out/iso
          sha256sum -- *.iso | tee SHA256SUMS
          ls -l

      - name: Test complet en machine virtuelle (KVM + UEFI)
        id: vm
        if: github.event_name != 'workflow_dispatch' || inputs.test_vm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf gdisk dosfstools ntfs-3g mtools btrfs-progs
          sudo bash tests/vm/run.sh out/iso/*.iso out/vm

      - name: Publication (ISO, dépôt [nova], captures)
        id: publication
        if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish.sh

      - name: Journaux (release « ci-logs »)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: bash scripts/ci/publish-logs.sh iso
